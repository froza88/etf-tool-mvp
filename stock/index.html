<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A股实时行情 · 数据聚合中间层</title>
<style>
:root{
  --bg:#FEFCF8;--card:#FFFDF9;--border:#E8E2D5;--text:#2C2416;--text2:#8B7E6B;
  --red:#C0392B;--green:#27AE60;--blue:#2E86C1;--purple:#8E44AD;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--border)}
nav .logo{font-size:17px;font-weight:700}
nav .logo a{color:var(--text);text-decoration:none}
nav a.back{color:var(--blue);text-decoration:none;font-size:13px;padding:6px 14px;border:1px solid var(--border);border-radius:6px}
nav a.back:hover{background:var(--border)}
.container{max-width:900px;margin:0 auto;padding:0 20px 40px}
h1{font-size:28px;text-align:center;margin:48px 0 8px;font-weight:800}
.subtitle{text-align:center;color:var(--text2);font-size:14px;margin-bottom:32px}
/* 搜索区 */
.search-box{display:flex;gap:10px;margin-bottom:8px}
.search-box input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:16px;outline:none;background:var(--bg);font-family:inherit}
.search-box input:focus{border-color:var(--blue)}
.search-box button{padding:12px 28px;background:linear-gradient(135deg,var(--blue),#1a6daa);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.search-box button:hover{opacity:.9}
.search-hint{font-size:12px;color:var(--text2);margin-bottom:20px}
/* 股票卡片区 */
.stock-list{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
.stock-card{display:flex;gap:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;box-shadow:var(--shadow);align-items:stretch}
.stock-card .info-col{flex:0 0 240px;min-width:200px}
.stock-card .kline-col{flex:1;min-width:0;position:relative}
.stock-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stock-card .name{font-size:18px;font-weight:700}
.stock-card .code{font-size:12px;color:var(--text2)}
.stock-card .price{font-size:36px;font-weight:800;margin:8px 0}
.stock-card .price.up{color:var(--red)}.stock-card .price.down{color:var(--green)}
.stock-card .change{font-size:15px;margin-bottom:16px}
.stock-card .change.up{color:var(--red)}.stock-card .change.down{color:var(--green)}
.stock-card .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.stock-card .info-item .label{color:var(--text2);font-size:11px}
.stock-card .info-item .val{font-weight:600}
.mini-kline{width:100%!important;height:100%!important}
/* 状态 */
.loading{text-align:center;padding:60px;color:var(--text2)}
.error{text-align:center;padding:30px;color:var(--red);font-size:14px}
footer{text-align:center;padding:30px;color:var(--text2);font-size:12px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<nav>
  <div class="logo"><a href="../">ETF 实时对比</a> · A股行情</div>
  <a href="../" class="back">← 返回 ETF 对比</a>
</nav>
<div class="container">
  <h1>A 股实时行情</h1>
  <p class="subtitle">输入股票代码或名称，实时价/涨跌幅/PE/市值 · 腾讯行情数据</p>

  <div class="search-box">
    <input type="text" id="codeInput" placeholder="股票代码，逗号分隔 如：600519,000858,601318" value="600519,000858,300750">
    <button onclick="doSearch()">查询</button>
  </div>
  <p class="search-hint">支持沪市(sh)、深市(sz)代码。自动识别 600xxx / 000xxx / 300xxx / 688xxx 等前缀</p>

  <div id="stockArea"><div class="loading">输入代码后点击查询</div></div>
</div>
<footer>A股实时行情数据来源：腾讯行情 (sqt.gtimg.cn) · K线数据：腾讯前复权日线 (ifzq.gtimg.cn)</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
// ===== 腾讯行情 JSONP =====
var QT_FIELDS={
  name:1, code:2, price:3, prev_close:4, open:5, volume:6, amount:37,
  high:33, low:34, amplitude:43, turnover:38, pe:39, market_cap:45,
  high52:34, low52:35, change:31, change_pct:32, update_time:30
};

function fetchQuotes(codes){
  var prefixMap={};
  codes.forEach(function(c){
    if(c.startsWith('60')||c.startsWith('68')||c.startsWith('51')||c.startsWith('56'))prefixMap[c]='sh';
    else prefixMap[c]='sz';
  });
  var symbols=codes.map(function(c){return prefixMap[c]+c;}).join(',');
  return new Promise(function(resolve){
    var finished=false;
    function finish(results){if(finished)return;finished=true;try{script.remove();}catch(e){}resolve(results);}
    var script=document.createElement('script');
    script.src='https://sqt.gtimg.cn/q='+symbols;
    script.onload=function(){
      console.log('[JSONP] script loaded, symbols='+symbols);
      var out={};
      codes.forEach(function(c){
        var key='v_'+prefixMap[c]+c;
        var raw=window[key];
        console.log('[JSONP] key='+key+' type='+(typeof raw));
        if(raw&&typeof raw==='string'){out[key]=raw;}
        try{delete window[key];}catch(e){}
      });
      finish(out);
    };
    script.onerror=function(e){
      console.error('[JSONP] script error',e);
      finish({});
    };
    document.head.appendChild(script);
    setTimeout(function(){console.warn('[JSONP] timeout');finish({});},5000);
  });
}

function parseQuote(raw){
  if(!raw)return null;
  var s=raw.split('~');
  if(s.length<40)return null;
  var name=s[QT_FIELDS.name];
  if(!name||name==='')return null;
  var ts=s[QT_FIELDS.update_time]||'';
  var upd=(ts.length>=14)?ts.slice(0,4)+'-'+ts.slice(4,6)+'-'+ts.slice(6,8)+' '+ts.slice(8,10)+':'+ts.slice(10,12)+':'+ts.slice(12,14):ts;
  return {
    name:name,
    code:s[QT_FIELDS.code],
    price:parseFloat(s[QT_FIELDS.price])||0,
    prev_close:parseFloat(s[QT_FIELDS.prev_close])||0,
    open:parseFloat(s[QT_FIELDS.open])||0,
    high:parseFloat(s[QT_FIELDS.high])||0,
    low:parseFloat(s[QT_FIELDS.low])||0,
    volume:parseInt(s[QT_FIELDS.volume])||0,
    amount:parseFloat(s[QT_FIELDS.amount])||0,
    amplitude:parseFloat(s[QT_FIELDS.amplitude])||0,
    turnover:parseFloat(s[QT_FIELDS.turnover])||0,
    pe:parseFloat(s[QT_FIELDS.pe])||0,
    market_cap:parseFloat(s[QT_FIELDS.market_cap])||0,
    change:parseFloat(s[QT_FIELDS.change])||0,
    change_pct:parseFloat(s[QT_FIELDS.change_pct])||0,
    update_time:upd
  };
}

// ===== 腾讯 K线 =====
function fetchKLine(code,period){
  var days={'1m':22,'3m':66,'6m':132,'1y':252};
  var limit=days[period]||66;
  var prefix=code.startsWith('60')||code.startsWith('68')?'sh':'sz';
  var url='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+prefix+code+',day,,,'+limit+',qfq';
  return fetch(url).then(function(r){return r.json();}).then(function(d){
    var key=prefix+code,stock=(d.data||{})[key]||{};
    var klines=stock['qfqday']||stock['day']||[];
    if(klines.length===0){console.warn('[KLine] empty for '+code,d);return null;}
    var dates=[],opens=[],highs=[],lows=[],closes=[],vols=[];
    klines.forEach(function(k){
      dates.push(k[0]);
      opens.push(parseFloat(k[1]));closes.push(parseFloat(k[2]));highs.push(parseFloat(k[3]));
      lows.push(parseFloat(k[4]));vols.push(parseFloat(k[5]));
    });
    console.log('[KLine] '+code+' loaded '+klines.length+' bars');
    return {dates:dates,opens:opens,highs:highs,lows:lows,closes:closes,vols:vols};
  }).catch(function(e){console.error('[KLine] fetch error',e);return null;});
}

// ===== 渲染 =====
var currentPeriod='1m',currentCode=null,klineData=null;

function doSearch(){
  var raw=document.getElementById('codeInput').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
  if(raw.length===0)return;
  var prefixMap={};
  raw.forEach(function(c){
    if(c.startsWith('60')||c.startsWith('68')||c.startsWith('51')||c.startsWith('56'))prefixMap[c]='sh';
    else prefixMap[c]='sz';
  });
  var area=document.getElementById('stockArea');
  area.innerHTML='<div class="loading">正在获取实时行情…</div>';
  fetchQuotes(raw).then(function(data){
    console.log('[doSearch] data keys',Object.keys(data));
    var stocks=[];
    raw.forEach(function(c){
      var key='v_'+prefixMap[c]+c,rawData=data[key];
      if(rawData){var q=parseQuote(rawData);if(q)stocks.push(q);}
    });
    if(stocks.length===0){area.innerHTML='<div class="error">未获取到行情数据，请检查代码（当前日期：'+new Date().toLocaleString()+'）</div>';return;}
    renderStocks(stocks);
  }).catch(function(e){
    console.error('[doSearch] error',e);
    area.innerHTML='<div class="error">行情获取失败：'+(e&&e.message||'未知错误')+'</div>';
  });
}

function renderStocks(stocks){
  var html='<div class="stock-list">';
  stocks.forEach(function(s,i){
    var cls=s.change_pct>=0?'up':'down',sign=s.change_pct>=0?'+':'';
    html+='<div class="stock-card" data-code="'+s.code+'">';
    html+='<div class="info-col">';
    html+='<div class="header"><span class="name">'+s.name+'</span><span class="code">'+s.code+'</span></div>';
    html+='<div class="price '+cls+'">'+s.price.toFixed(2)+'</div>';
    html+='<div class="change '+cls+'">'+sign+s.change_pct.toFixed(2)+'%</div>';
    html+='<div style="font-size:11px;color:var(--text2);margin-bottom:10px">'+s.update_time+'</div>';
    html+='<div class="info-grid">';
    html+='<div class="info-item"><div class="label">今开</div><div class="val">'+s.open.toFixed(2)+'</div></div>';
    html+='<div class="info-item"><div class="label">昨收</div><div class="val">'+s.prev_close.toFixed(2)+'</div></div>';
    html+='<div class="info-item"><div class="label">最高</div><div class="val">'+s.high.toFixed(2)+'</div></div>';
    html+='<div class="info-item"><div class="label">最低</div><div class="val">'+s.low.toFixed(2)+'</div></div>';
    html+='<div class="info-item"><div class="label">成交量</div><div class="val">'+(s.volume/1e4).toFixed(1)+'万手</div></div>';
    html+='<div class="info-item"><div class="label">成交额</div><div class="val">'+(s.amount/1e4).toFixed(2)+'亿</div></div>';
    html+='<div class="info-item"><div class="label">振幅</div><div class="val">'+s.amplitude.toFixed(2)+'%</div></div>';
    html+='<div class="info-item"><div class="label">换手率</div><div class="val">'+s.turnover.toFixed(2)+'%</div></div>';
    html+='<div class="info-item"><div class="label">PE(TTM)</div><div class="val">'+(s.pe?Number(s.pe).toFixed(2):'-')+'</div></div>';
    html+='<div class="info-item"><div class="label">总市值</div><div class="val">'+(s.market_cap?Number(s.market_cap).toFixed(0)+'亿':'-')+'</div></div>';
    html+='</div></div><!-- /info-col -->';
    html+='<div class="kline-col"><canvas class="mini-kline" id="mk_'+s.code+'"></canvas></div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('stockArea').innerHTML=html;
  window._stocks=stocks;
  // 加载所有迷你K线
  loadMiniKLines(stocks);
}

// ===== 迷你 K 线（每个卡片内嵌） =====
var MINI_CHARTS={};
function loadMiniKLines(stocks){
  stocks.forEach(function(s,i){
    fetchKLine(s.code,'1m').then(function(data){
      if(!data||!data.closes||data.closes.length<2)return;
      var canvas=document.getElementById('mk_'+s.code);
      if(!canvas)return;
      var parent=canvas.parentElement;
      if(parent)parent.style.minHeight='220px';
      if(MINI_CHARTS[s.code])MINI_CHARTS[s.code].destroy();
      var ctx=canvas.getContext('2d');
      var up=data.closes[data.closes.length-1]>=data.closes[0];
      var lineC=up?'#C0392B':'#27AE60',fillC=up?'rgba(192,57,43,0.08)':'rgba(39,174,96,0.08)';
      var maxVol=Math.max.apply(null,data.vols)||1;
      var volData=data.vols.map(function(v){return Math.round(v/maxVol*30);});
      MINI_CHARTS[s.code]=new Chart(ctx,{
        data:{labels:data.dates,
          datasets:[
            {label:'量',data:volData,backgroundColor:'rgba(139,126,107,0.2)',borderColor:'rgba(139,126,107,0.3)',borderWidth:0.5,order:2,yAxisID:'vol',type:'bar',barPercentage:0.9,categoryPercentage:1},
            {label:'价',data:data.closes,borderColor:lineC,backgroundColor:fillC,borderWidth:1.5,fill:true,tension:0.3,pointRadius:0,order:1,yAxisID:'price',type:'line'}
          ]},
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},
            tooltip:{callbacks:{label:function(ctx){
              if(ctx.datasetIndex===0)return '量:'+(data.vols[ctx.dataIndex]/1e4).toFixed(1)+'万手';
              var i=ctx.dataIndex;
              return [s.name,'收:'+data.closes[i].toFixed(2),'开:'+data.opens[i].toFixed(2),'高:'+data.highs[i].toFixed(2),'低:'+data.lows[i].toFixed(2)];
            }}}
          },
          scales:{
            x:{display:false},
            price:{type:'linear',position:'left',display:false,min:Math.min.apply(null,data.closes)*0.97,max:Math.max.apply(null,data.closes)*1.03},
            vol:{type:'linear',position:'right',display:false,grid:{display:false},max:maxVol*1.5}
          }
        }
      });
    });
  });
}

// ===== 初始化 =====
document.getElementById('codeInput').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
// 自动加载默认代码
setTimeout(doSearch,300);
</script>
</body>
</html>
