<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 实时对比 · v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--sub:#888;--red:#d32f2f;--green:#2e7d32;--blue:#1565c0;--border:#e8e8e8;--best-bg:#fff8e1}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px 16px}
header{margin-bottom:20px}
header h1{font-size:22px;margin-bottom:4px;color:var(--red)}
.arch-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.arch-tag{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.arch-tag.api{background:#64b5f6;color:#0d47a1}
.arch-tag.live{background:#c8e6c9;color:#1b5e20}
.search-section{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px}
.search-row{display:flex;gap:10px;align-items:center}
.search-box{flex:1;position:relative}
.search-box input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--blue)}
.dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;max-height:240px;overflow-y:auto;z-index:100;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.dropdown.active{display:block}
.dropdown-item{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f5f5f5}
.dropdown-item:hover{background:#f0f4ff}
.selected-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;min-height:28px}
.selected-chip{padding:5px 12px;background:var(--red);color:#fff;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.selected-chip::after{content:'×';opacity:.7;font-size:14px}
.btn-row{display:flex;gap:10px;align-items:center}
.btn{border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;padding:9px 20px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:#f5f5f5}
.status-bar{display:flex;gap:20px;padding:10px 16px;background:var(--card);border-radius:8px;margin-bottom:16px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-dot.green{background:var(--green)}
.status-dot.gray{background:#ccc}
.hint-row{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hint-tag{padding:2px 8px;background:#f0f4ff;border:1px solid #c5cae9;border-radius:10px;font-size:11px;color:#1565c0;cursor:pointer;transition:background .2s}
.hint-tag:hover{background:#e3f2fd}
.compare-card{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;margin-bottom:20px}
.compare-title{padding:16px 20px;font-size:15px;font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-wrap{overflow-x:auto}
.compare-table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.compare-table th,.compare-table td{padding:10px 14px;text-align:center;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.compare-table th{background:#fafafa;font-weight:600}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;font-weight:600;color:var(--sub)}
.compare-table tr:hover td{background:#f8f9ff}
.compare-table .best{color:var(--red);font-weight:700;background:var(--best-bg)}
.compare-table .price-up{color:var(--red)}
.compare-table .price-down{color:var(--green)}
.compare-table .etf-name{font-size:13px;color:var(--text)}
.compare-table .etf-code{font-size:11px;color:var(--sub)}
.holding-tag{display:inline-block;padding:2px 6px;background:#f0f0f0;border-radius:4px;font-size:11px;margin:1px}
.loading{text-align:center;padding:40px;color:var(--sub)}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>ETF 实时对比 · v2</h1>
  <div class="arch-bar">
    <span class="arch-tag api">PA API · 1685只 · 21字段</span>
    <span class="arch-tag live" id="liveTag" style="display:none">腾讯行情 ✓</span>
  </div>
</header>

<div class="status-bar">
  <div><span class="status-dot green" id="sDot1"></span> API：<span id="sApi">就绪</span></div>
  <div><span class="status-dot gray" id="sDot2"></span> 行情：<span id="sPrice">等待对比</span></div>
  <div style="margin-left:auto;font-weight:600;color:#1a1a2e;font-size:14px" id="liveClock">--</div>
</div>

<div class="search-section">
  <div class="search-row">
    <div class="search-box">
      <input id="searchInput" placeholder="输入ETF代码，如 510300" autocomplete="off" onfocus="showHotETF()" oninput="handleSearch(this.value)">
      <div class="dropdown" id="dropdown"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="compareBtn" disabled onclick="startCompare()">开始对比</button>
      <button class="btn btn-outline" onclick="clearAll()">清空</button>
    </div>
  </div>
  <div class="hint-row">
    <span style="color:#aaa;font-size:11px">💡 热门：</span>
    <span class="hint-tag" onclick="quickSearch('510300')">510300 沪深300</span>
    <span class="hint-tag" onclick="quickSearch('159915')">159915 创业板</span>
    <span class="hint-tag" onclick="quickSearch('518880')">518880 黄金</span>
    <span class="hint-tag" onclick="quickSearch('588000')">588000 科创50</span>
    <span class="hint-tag" onclick="quickSearch('510500')">510500 中证500</span>
    <span class="hint-tag" onclick="quickSearch('513100')">513100 纳指</span>
    <span class="hint-tag" onclick="quickSearch('511260')">511260 国债</span>
  </div>
  <div class="selected-row" id="selectedRow">
    <span style="color:#888;font-size:12px">已选ETF：</span>
  </div>
</div>

<div id="result"></div>
</div>

<script>
// ============================================================
// 实时时钟
// ============================================================
function tick(){const n=new Date();document.getElementById('liveClock').textContent=n.toLocaleTimeString('zh-CN',{hour12:false});}
tick();setInterval(tick,1000);

// ============================================================
// 全局状态（完全照搬 V1 模式）
// ============================================================
const PA = 'https://froza.pythonanywhere.com';
let selected = [];
let PRICE_CACHE = {};  // { code: { latest_price, prev_close, change_pct, ts } }

// ========== 搜索 ==========
async function handleSearch(kw) {
  if(!kw||kw.length<1){ showHotETF(); return; }
  try{
    const r=await fetch(`${PA}/api/etf/search?q=${encodeURIComponent(kw)}&limit=15`);
    showDropdown((await r.json()).results||[]);
  }catch(e){console.error(e);}
}
function showHotETF(){ showDropdown([{code:'510300',name:'沪深300ETF',issuer:'华泰柏瑞'},{code:'510330',name:'沪深300ETF易方达',issuer:'易方达'},{code:'159915',name:'创业板ETF',issuer:'易方达'},{code:'518880',name:'黄金ETF',issuer:'华安'},{code:'588000',name:'科创50ETF',issuer:'华夏'}]); }
function quickSearch(k){ document.getElementById('searchInput').value=k; handleSearch(k); }
function showDropdown(items){
  const dd=document.getElementById('dropdown'); dd.innerHTML='';
  if(!items.length){ dd.classList.remove('active'); return; }
  items.forEach(e=>{
    const d=document.createElement('div'); d.className='dropdown-item';
    d.innerHTML=`<div><b>${e.name}</b> <span style="color:#aaa;font-size:11px">${e.code}</span><br><span style="font-size:11px;color:#999">${[e.category,e.issuer].filter(Boolean).join(' · ')}</span></div>`;
    d.onclick=()=>addETF(e); dd.appendChild(d);
  });
  dd.classList.add('active');
}
function addETF(e){
  if(selected.find(x=>x.code===e.code)) return;
  if(selected.length>=5){ alert('最多5只'); return; }
  selected.push(e); renderSel();
  document.getElementById('dropdown').classList.remove('active');
  document.getElementById('searchInput').value='';
}
function renderSel(){
  const r=document.getElementById('selectedRow'); r.innerHTML='';
  selected.forEach((e,i)=>{
    const c=document.createElement('span'); c.className='selected-chip';
    c.textContent=`${e.name} (${e.code})`;
    c.onclick=()=>{ selected.splice(i,1); renderSel(); };
    r.appendChild(c);
  });
  document.getElementById('compareBtn').disabled=selected.length<2;
}
function clearAll(){ selected=[]; renderSel(); document.getElementById('result').innerHTML=''; PRICE_CACHE={}; }

// ========== 行情 JSONP（完全照搬 V1） ==========
function fetchTencentDirect(codes) {
  return new Promise((resolve) => {
    const prefixMap = {};
    codes.forEach(c => { prefixMap[c] = (c.startsWith('5') || c.startsWith('6')) ? 'sh' : 'sz'; });
    const symbols = codes.map(c => prefixMap[c] + c).join(',');
    const script = document.createElement('script');
    script.src = 'https://sqt.gtimg.cn/q=' + symbols;
    script.onload = () => {
      const results = {};
      codes.forEach(code => {
        const varName = 'v_' + prefixMap[code] + code;
        const raw = window[varName];
        if (raw && typeof raw === 'string') {
          const parts = raw.split('~');
          if (parts.length >= 33) {
            results[code] = {
              prev_close: parts[4],
              latest_price: parts[3],
              change_pct: parts[32],
            };
          }
          try { delete window[varName]; } catch(e) {}
        } else {
          results[code] = {};
        }
      });
      script.remove();
      resolve(results);
    };
    script.onerror = () => {
      const results = {}; codes.forEach(c => { results[c] = {}; });
      script.remove();
      resolve(results);
    };
    document.head.appendChild(script);
  });
}

async function getPrices(codes) {
  // 有缓存直接返回
  const now = Date.now();
  const allCached = codes.every(c => PRICE_CACHE[c] && now - PRICE_CACHE[c].ts < 60000);
  if (allCached) {
    const r = {}; codes.forEach(c => { r[c] = PRICE_CACHE[c]; });
    return r;
  }
  document.getElementById('sDot2').className='status-dot gray';
  document.getElementById('sPrice').textContent='获取中…';
  const data = await fetchTencentDirect(codes);
  Object.entries(data).forEach(([code, info]) => {
    if (info && (info.prev_close || info.change_pct)) {
      PRICE_CACHE[code] = { ...info, ts: Date.now() };
    }
  });
  document.getElementById('sDot2').className='status-dot green';
  document.getElementById('sPrice').textContent=`${codes.length}只`; document.getElementById('sPrice').style.color='#2e7d32';
  document.getElementById('liveTag').style.display='inline';
  return data;
}

// ========== 对比 ==========
async function startCompare() {
  if(selected.length<2) return;
  document.getElementById('result').innerHTML='<div class="loading"><div class="spinner"></div>加载中…</div>';
  const codes=selected.map(e=>e.code);
  const [apiR] = await Promise.all([
    fetch(`${PA}/api/compare?codes=${codes.join(',')}`).then(r=>r.json()),
    getPrices(codes)
  ]);
  document.getElementById('sDot1').className='status-dot green';
  document.getElementById('sApi').textContent=`${apiR.count}只`;
  renderTable(apiR.etfs, apiR.updated);
}

function renderTable(etfs, updated) {
  if(!etfs?.length){ document.getElementById('result').innerHTML='<p style="color:#888">无数据</p>'; return; }

  // 数据日期
  const dt = updated ? updated.slice(0,10) : (new Date()).toISOString().slice(0,10);
  const note = `<span style="font-size:11px;color:#999">数据快照: ${dt} | 实时价: 腾讯行情 | 规模/收益/风险: Wind</span>`;

  const metrics=[
    ['实时价',   'live',    'up',      ''],
    ['昨收价',   'preclose','neutral',''],
    ['涨跌幅',    'pct',     'up',      '%'],
    ['规模(亿)',  'scale_yi','up',      ''],
    ['近1年收益', 'year_1_return','up','%'],
    ['近3年收益', 'year_3_return','up','%'],
    ['管理费(%)', 'fee_mgmt','down',    ''],
    ['托管费(%)', 'fee_custody','down', ''],
    ['总费率(%)', 'fee_total','down',   ''],
    ['夏普比率',   'sharpe_ratio','up', ''],
    ['Calmar',   'calmar_ratio','up',   ''],
    ['最大回撤(%)','max_drawdown','down',''],
    ['年化波动(%)','annual_vol','down',  ''],
    ['跟踪误差(%)','tracking_error','down',''],
    ['基金公司',   'issuer',   'neutral',''],
    ['跟踪指数',   'track_index','neutral',''],
    ['成立日期',   'listing_date','neutral',''],
    ['分类',     'category', 'neutral',''],
  ];

  function bestVal(key,dir){
    const vs=etfs.map(e=>e[key]).filter(v=>v!=null&&!isNaN(v));
    if(!vs.length) return null;
    return dir==='up'?Math.max(...vs):Math.min(...vs);
  }

  function fmt(key,e){
    const v=e[key];
    if(v==null&&key!=='live'&&key!=='pct'&&key!=='preclose') return '-';
    if(key==='live'){
      const p=PRICE_CACHE[e.code]; if(!p||!p.latest_price) return '-';
      return parseFloat(p.latest_price).toFixed(3);
    }
    if(key==='preclose'){
      const p=PRICE_CACHE[e.code]; if(!p||!p.prev_close) return '-';
      return parseFloat(p.prev_close).toFixed(3);
    }
    if(key==='pct'){
      const p=PRICE_CACHE[e.code]; if(!p||!p.change_pct) return '-';
      const cp=parseFloat(p.change_pct), up=cp>0, dn=cp<0;
      return `<span style="color:${up?'#d32f2f':dn?'#2e7d32':'#666'};font-weight:600">${(cp>0?'+':'')+cp.toFixed(2)}%</span>`;
    }
    // 文本字段直接返回
    if(['issuer','track_index','listing_date','category'].includes(key)) return v || '-';
    return Number(v).toFixed(2);
  }

  let h='<div class="compare-card"><div class="compare-title">📊 对比详情 '+note+'</div><div class="table-wrap"><table class="compare-table">';
  h+='<tr><th>指标</th>';
  etfs.forEach(e=>h+=`<th><div class="etf-name">${e.name}</div><div class="etf-code">${e.code}</div></th>`);
  h+='</tr>';

  metrics.forEach(([label,key,dir,unit])=>{
    const best=dir!=='neutral'?bestVal(key,dir):null;
    h+='<tr><td>'+label+'</td>';
    etfs.forEach(e=>{
      const v=key==='live'||key==='pct'||key==='preclose'?null:e[key];
      const isBest=best!=null&&v!=null&&!isNaN(v)&&Math.abs(v-best)<0.001;
      h+=`<td class="${isBest?'best':''}">${fmt(key,e)}${unit&&key!=='live'&&key!=='pct'&&key!=='preclose'&&v!=null?' '+unit:''}</td>`;
    });
    h+='</tr>';
  });

  h+='<tr><td>持仓TOP5</td>';
  etfs.forEach(e=>{
    const hd=e.holdings||[];
    h+='<td style="text-align:left;white-space:normal">';
    hd.slice(0,5).forEach(hh=>h+=`<span class="holding-tag">${hh.name}${hh.weight?' '+hh.weight:''}</span>`);
    h+='</td>';
  });
  h+='</tr></table></div><div style="padding:8px 14px;font-size:11px;color:#999;border-top:1px solid var(--border)">⚠️ 规模/收益/风险指标为快照数据（截至'+dt+'），费率/跟踪指数/持仓为静态数据。实时价来自腾讯行情。</div></div>';
  document.getElementById('result').innerHTML=h;
}

document.addEventListener('click',e=>{ if(!e.target.closest('.search-box')) document.getElementById('dropdown').classList.remove('active'); });
</script>
</body>
</html>
