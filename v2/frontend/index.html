<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 实时对比 · v2 动态版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--sub:#888;--red:#d32f2f;--green:#2e7d32;--blue:#1565c0;--border:#e8e8e8;--best-bg:#fff8e1}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:100%;margin:0 auto;padding:24px 16px}
header{margin-bottom:20px}
header h1{font-size:22px;margin-bottom:4px;color:var(--red)}
.arch-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.arch-tag{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.arch-tag.api{background:#64b5f6;color:#0d47a1}
.arch-tag.v2{background:#fff59d;color:#f57f17}
.search-section{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px}
.search-row{display:flex;gap:10px;align-items:center}
.search-box{flex:1;position:relative}
.search-box input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--blue)}
.dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;max-height:240px;overflow-y:auto;z-index:100;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.dropdown.active{display:block}
.dropdown-item{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f5f5f5}
.dropdown-item:hover,.dropdown-item.hover{background:#f0f4ff}
.dropdown-item .name{font-weight:600}
.dropdown-item .meta{font-size:11px;color:var(--sub)}
.selected-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center;min-height:28px}
.selected-chip{padding:5px 12px;background:var(--red);color:#fff;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.selected-chip::after{content:'×';opacity:.7;font-size:14px}
.btn-row{display:flex;gap:10px;align-items:center}
.btn-compare{padding:9px 20px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-compare:hover{opacity:.9}
.status-bar{display:flex;gap:20px;padding:10px 16px;background:var(--card);border-radius:8px;margin-bottom:16px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-dot.green{background:var(--green)}
.status-dot.gray{background:#ccc}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🚀 ETF 实时对比 · v2 动态版</h1>
  <div class="arch-bar">
    <span class="arch-tag api">PA API · 动态加载</span>
    <span class="arch-tag v2">v2 动态版 · 不依赖静态 JSON</span>
  </div>
</header>

<div class="status-bar" id="statusBar">
  <div><span class="status-dot green"></span> PA API：<span id="statusApi" style="color:#2e7d32">等待请求</span></div>
  <div><span class="status-dot gray" id="dot2"></span> 腾讯行情：<span id="statusPrice" style="color:#999">等待对比</span></div>
</div>

<div class="search-section">
  <div class="search-row">
    <div class="search-box">
      <input id="searchInput" placeholder="输入代码或名称搜索（v2 动态搜索）" autocomplete="off" oninput="handleSearch(this.value)">
      <div class="dropdown" id="dropdown"></div>
    </div>
    <div class="btn-row">
      <button class="btn-compare" id="compareBtn" disabled onclick="startCompare()">开始对比</button>
      <button class="btn-clear" onclick="clearAll()">清空</button>
    </div>
  </div>
  <div class="selected-row" id="selectedRow">
    <span style="color:#888;font-size:12px">已选ETF：</span>
  </div>
</div>

<div id="result"></div>
</div>

<script>
// ============================================================
//  v2 核心：动态加载，不依赖 etf_data_embed.js
// ============================================================

const PA_API = 'https://froza.pythonanywhere.com';

let selectedETFs = [];

// 搜索 ETF（动态调用 PA API）
async function handleSearch(keyword) {
  if (!keyword || keyword.length < 1) {
    document.getElementById('dropdown').classList.remove('active');
    return;
  }
  
  try {
    const resp = await fetch(`${PA_API}/api/etf/search?q=${encodeURIComponent(keyword)}&limit=15`);
    const data = await resp.json();
    showDropdown(data.results || []);
  } catch (e) {
    console.error('搜索失败:', e);
  }
}

function showDropdown(results) {
  const dd = document.getElementById('dropdown');
  dd.innerHTML = '';
  
  if (!results.length) {
    dd.classList.remove('active');
    return;
  }
  
  results.forEach(etf => {
    const div = document.createElement('div');
    div.className = 'dropdown-item';
    div.innerHTML = `
      <div class="info">
        <span class="name">${etf.name} (${etf.code})</span>
        <span class="meta">${etf.category || ''} · ${etf.issuer || ''}</span>
      </div>
      <span class="add">+</span>
    `;
    div.onclick = () => addETF(etf);
    dd.appendChild(div);
  });
  
  dd.classList.add('active');
}

function addETF(etf) {
  if (selectedETFs.find(e => e.code === etf.code)) return;
  if (selectedETFs.length >= 5) {
    alert('最多对比 5 只 ETF');
    return;
  }
  
  selectedETFs.push(etf);
  renderSelected();
  document.getElementById('dropdown').classList.remove('active');
  document.getElementById('searchInput').value = '';
}

function renderSelected() {
  const row = document.getElementById('selectedRow');
  row.innerHTML = '<span style="color:#888;font-size:12px">已选ETF：</span>';
  
  selectedETFs.forEach((etf, i) => {
    const chip = document.createElement('div');
    chip.className = 'selected-chip';
    chip.textContent = `${etf.name} (${etf.code})`;
    chip.onclick = () => {
      selectedETFs.splice(i, 1);
      renderSelected();
    };
    row.appendChild(chip);
  });
  
  document.getElementById('compareBtn').disabled = selectedETFs.length < 2;
}

function clearAll() {
  selectedETFs = [];
  renderSelected();
  document.getElementById('result').innerHTML = '';
}

// 开始对比（调用 PA API）
async function startCompare() {
  if (selectedETFs.length < 2) return;
  
  const codes = selectedETFs.map(e => e.code).join(',');
  document.getElementById('statusApi').textContent = '加载中...';
  document.getElementById('statusApi').style.color = '#f9a825';
  
  try {
    const resp = await fetch(`${PA_API}/api/compare?codes=${codes}`);
    const data = await resp.json();
    
    document.getElementById('statusApi').textContent = `已加载 ${data.count} 只 ETF`;
    document.getElementById('statusApi').style.color = '#2e7d32';
    
    renderCompare(data.etfs);
  } catch (e) {
    document.getElementById('statusApi').textContent = '加载失败';
    document.getElementById('statusApi').style.color = '#d32f2f';
    console.error('对比失败:', e);
  }
}

function renderCompare(etfs) {
  if (!etfs || !etfs.length) {
    document.getElementById('result').innerHTML = '<p style="color:#888">未找到数据</p>';
    return;
  }
  
  // 简化展示：表格形式
  let html = '<div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#fafafa">';
  html += '<th>ETF</th><th>规模</th><th>近1年</th><th>费率</th><th>夏普</th>';
  html += '</tr>';
  
  etfs.forEach(etf => {
    html += '<tr>';
    html += `<td style="font-weight:600">${etf.name} (${etf.code})</td>`;
    html += `<td>${etf.scale ? (etf.scale / 1e8).toFixed(1) + '亿' : '-'}</td>`;
    html += `<td>${etf.year_1_return ? etf.year_1_return.toFixed(2) + '%' : '-'}</td>`;
    html += `<td>${etf.fee_rate ? (etf.fee_rate * 100).toFixed(2) + '%' : '-'}</td>`;
    html += `<td>${etf.sharpe_ratio ? etf.sharpe_ratio.toFixed(2) : '-'}</td>`;
    html += '</tr>';
  });
  
  html += '</table></div>';
  document.getElementById('result').innerHTML = html;
}

// 点击外部关闭下拉
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) {
    document.getElementById('dropdown').classList.remove('active');
  }
});
</script>
</body>
</html>
